name: Release

# Tag-based GitHub Release.
#
# Push an annotated tag matching `v*` (e.g. `v0.1.0`) to trigger this. The
# release version comes from the tag (v0.1.0 -> 0.1.0) and must match the
# `version` in package.json — the job fails fast otherwise, so releases stay
# consistent. On success it runs the full gate and creates a GitHub Release.
#
# Consumers pin this package via a `github:` git dependency (not npm), so there
# is no npm publish step: the tag itself is the release artifact. If npm
# distribution is wanted later, add a publish step gated on an NPM_TOKEN secret.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Fail early if the pushed tag doesn't match the package version, so a
      # mistagged release never ships.
      - name: Check tag matches package.json version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (=$VERSION) does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # Full gate (typecheck/build/smoke/test/pack/leak).
      - name: Verify
        run: npm run verify

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
