name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reading is all the token does here: checkout, and, only when the runner's
# tool cache lacks the Node asked for, setup-node's lookup of the Node release
# manifest. This workflow writes nothing back — no comment, no commit, no
# release — and setup-node saves its npm cache with the runner's own token,
# which `permissions` does not govern. Spelled out rather than left to the
# repository default, which lives in the settings rather than in this file
# and can grant write to almost every scope without anyone touching a
# workflow file. Mirrors release.yml, which asks for `contents: write`
# because it genuinely creates a GitHub Release.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # No later step uses git with the token, so checkout does not keep it.
      # This also proves, on every PR, the npm ci that release.yml runs the same way.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify
      # dist/ is committed and is what a consumer runs (see .gitignore), so it must be
      # the build of src/. verify's own build overwrites dist/ here and compares it
      # with nothing, so this step does the comparison. Keep it after verify: a source
      # that does not compile, or a failing test, is then reported by verify under its
      # own name, and a red here means only "dist/ was not rebuilt and committed". It
      # deletes dist/ first because tsc never deletes an output: built over the
      # committed copy, a file whose source is gone would stay and pass. The status
      # line prints every file that differs; it prints nothing when dist/ matches.
      # To fix a red: rm -rf dist && npm run build, then commit dist/.
      # test/ciDistGate.test.ts runs this script and keeps it in step with release.yml.
      - name: dist/ is the build of src/
        run: |
          rm -rf dist
          npm run build
          git status --porcelain --untracked-files=all -- dist
          git diff --exit-code --stat -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"

  # data-explorer-view (mathworks/data-explorer-view) is built on this package: its view
  # model reads core's nodes and sessions, and its widgets show them. A core change must
  # not regress it, and nothing else would see one: view's own CI installs the core tag
  # that view's package.json pins, so it meets a core change only when someone moves the
  # pin. So this job runs view's unit tests against this core, in place of the one view
  # pins, as view's own CI runs the VS Code extension's tests against each view change.
  #
  # Not a required check, so a red here does not block a merge: an intentional change in
  # what core does can break a view test that pinned the old behaviour, and that change
  # must still be able to merge. When it is red, the pull request names the view change
  # it needs (the view pull request that adapts the tests, or the issue for one). The
  # push run on main is then red until that change reaches view's main; re-run it then.
  # View's typecheck, build and browser tests are left out; its own CI runs them on the
  # pull request that moves the pin.
  downstream-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # View's main: the view this core reaches next. View is public, so the checkout
      # needs no token of its own, and none is kept.
      - uses: actions/checkout@v7
        with:
          repository: mathworks/data-explorer-view
          ref: main
          path: view
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            view/package-lock.json

      - run: npm ci

      # The dist/ this commit's src/ builds. build-and-test checks that the committed
      # dist/ is the same, and is red under its own name when it is not; this job still
      # tests what the source does.
      - run: npm run build

      # As view's CI installs them, core among them: by git, at the commit view's
      # lockfile pins.
      - name: Install view's dependencies
        working-directory: view
        run: npm ci

      # This core in place of the pinned one, swapped as scripts/verify-consumer.mjs swaps
      # it. Core publishes dist/ only (`files: ["dist"]`), so the installed package is
      # dist/ and a manifest, and replacing the two is installing this commit. The manifest
      # goes too because view reads core's version off it: test/sparseNoGrid.test.ts gates
      # half its cases on it. The pinned dist/ is deleted first because cp -R onto a
      # directory that exists copies into it. A dependency this core adds is not installed
      # into view; Node finds it in core's own node_modules, above view/.
      - name: Install this core over view's pin
        run: |
          rm -rf view/node_modules/data-explorer-core/dist
          cp -R dist view/node_modules/data-explorer-core/dist
          cp package.json view/node_modules/data-explorer-core/package.json

      # The next step tests this core only if it is the one installed. A swap that kept the
      # pinned core would make view's tests a test of the pin, green for the wrong reason.
      - name: The installed core is this one
        run: |
          diff -r dist view/node_modules/data-explorer-core/dist
          cmp package.json view/node_modules/data-explorer-core/package.json

      - name: View's unit tests
        working-directory: view
        run: npx vitest run
